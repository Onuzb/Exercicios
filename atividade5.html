<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="atividade5.css">
</head>
<body>
    <h1 class="titulo">Calculadora de IMC</h1>
    <input class="caixanum1" type="text" id="nome" placeholder="Nome">
    <input class="caixanum2" type="number" id="altura" placeholder="Altura (cm)">
    <input class="caixanum3" type="number" id="peso" placeholder="Peso (kg)">
    <button class="botao" onclick="imc()">Calcular IMC</button>
    <br>
    <input class="resultado" type="text" id="resultado" readonly placeholder="Resultado">
    <br>
    <input class="classificacao" type="text" id="classif" readonly placeholder="Classificação">
    <br>
    <input class="resultado2" type="text" id="resultFinal" readonly placeholder="Nome e classificação">

    <script src="atividade5.js"></script>
</body>
</html>
